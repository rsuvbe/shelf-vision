[project]
name = "shelf-vision"
version = "0.1.0"
description = "Retail shelf monitoring: product detection, SKU recognition, out-of-stock and planogram checks"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "ultralytics>=8.3",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
shelf = "shelf_vision.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf_vision"]

# RTX 50-series (Blackwell) needs CUDA 12.8 builds of PyTorch.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
