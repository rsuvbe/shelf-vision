# YOLO11m product detector on SKU-110K (one class: "object").
# Same recipe as yolo11s-sku110k.yaml with the bigger backbone: the 11s run
# plateaued at test mAP50-95 0.604, and a low-LR fine-tune did not help.
# Shelves are dense (about 150 boxes per image), so high resolution and a high
# max_det matter more than model size.
model: yolo11m.pt
data: SKU-110K.yaml   # ultralytics downloads the dataset on first use (~13 GB)
exclude: ../data/sku110k-damaged-train.txt   # 25 train photos with damaged pixels

train:
  epochs: 60
  imgsz: 960
  batch_per_8gb: 4    # measured: 5.6 GB at batch 4, 7.3 GB (assigner OOM) at 6
  max_det: 1000   # val has up to 718 boxes per image; 600 capped recall
  amp: true
  cache: false
  patience: 15        # also with --hours: the 11.32h run plateaued by epoch ~60
  seed: 0
  plots: true
